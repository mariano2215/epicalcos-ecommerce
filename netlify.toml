# ── URLs "bonitas" para anuncios → 301 a la página real ──────────────────────
# El plan CRO pedía landings /calcos-personalizadas, /calcos-para-negocios y
# /pack-100-calcos. Esas páginas YA EXISTEN: crear gemelas sería contenido
# duplicado y dos páginas que mantener por intención. Con un 301, el anuncio usa
# la URL linda y el cliente cae en la página real, que además ya está indexada.
# Las landings que SÍ son contenido nuevo (/calcos-termo, /calcos-notebook,
# /calcos-auto) son rutas del SPA, no redirects. Ver frontend/src/config/landings.js.
[[redirects]]
  from   = "/calcos-personalizadas"
  to     = "/personalizados"
  status = 301

[[redirects]]
  from   = "/calcos-para-negocios"
  to     = "/negocio"
  status = 301

[[redirects]]
  from   = "/pack-100-calcos"
  to     = "/mayorista"
  status = 301

[[redirects]]
  from   = "/armá-tu-pack"
  to     = "/armar-pack"
  status = 301

# ── Categorías dadas de baja el 23/8/2026 → 301 ──────────────────────────────
# El catálogo se reemplazó entero (94 categorías → 61) y estas 79 URLs quedaron
# sin destino. El SPA ya las mandaba a /categorias, pero recién en el navegador:
# para Google eso es una página que existe y devuelve 200, no una mudanza. Con
# el 301 el poco jugo que tuvieran pasa a la categoría que las reemplaza.
#
# 67 van a una categoría concreta (futbol-boca → boca-juniors, tv-marvel →
# marvel, pokemon → anime…) y 12 a /categorias, que son las que no tienen
# sucesora (halloween, star-wars, weed-creepy, pride…).
#
# Es una tabla HISTÓRICA y congelada: describe lo que existía antes del
# 23/8/2026, así que no se le agregan filas salvo que se den de baja categorías
# nuevas. Está espejada en frontend/public/_redirects y src/lib/redirects.test.js
# verifica que los dos archivos digan lo mismo.

[[redirects]]
  from   = "/categoria/autos-y-motos"
  to     = "/categoria/formula-1"
  status = 301

[[redirects]]
  from   = "/categoria/buenas-vibras"
